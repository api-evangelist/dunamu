contract_discovery:
  note: >-
    STEP 0b sweep, 2026-08-12. No machine-readable contract is served from any Dunamu-controlled
    host. /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /v3/api-docs,
    /llms.txt and /graphql were probed against dunamu.com, www.dunamu.com, stockplus.com,
    api.stockplus.com, api.dunamu.com and the three regional Upbit API hosts. Every result was a
    404, an SPA HTML shell, or a gateway error envelope. The one machine-readable agent surface
    Dunamu does serve is the Upbit Developer Center's llms.txt plus a Markdown twin of every docs
    page (append `.md` to any page URL) — captured in conventions/dunamu-conventions.yml.
  stockplus_spa:
    note: >-
      stockplus.com answers 200 with an HTML shell for /api-docs, /v3/api-docs and /graphql. This
      is an SPA catch-all, NOT a served contract — the dominant soft-200 false positive. Recorded
      as a miss.
    probes:
    - {url: 'https://stockplus.com/api-docs', status: 200, document: false}
    - {url: 'https://stockplus.com/v3/api-docs', status: 200, document: false}
    - {url: 'https://stockplus.com/graphql', status: 200, document: false}
