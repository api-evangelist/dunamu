note: >-
  Published rate limits for the developer surface Dunamu Inc. operates under the Upbit brand.
  Dunamu serves no rate-limited API of its own from dunamu.com. Read from the Upbit Developer
  Center rate-limits reference and its markdown twin on 2026-08-12. The same surface is
  catalogued as API entries on the Upbit provider profile; this record documents it at the
  corporate-parent level.
x-brand: Upbit
limit_count: 11
headers:
- name: Remaining-Req
  returned_on: every response
  format: 'group=<group>; min=<n>; sec=<n>'
  example: 'group=default; min=1800; sec=29'
  fields:
  - {field: group, meaning: the rate-limit group the called operation belongs to}
  - field: min
    meaning: >-
      DEPRECATED by the provider — documented as a fixed value that should be ignored. An agent
      must not budget against it.
  - {field: sec, meaning: remaining requests in the current second}
- name: Retry-After
  returned: unknown
  note: >-
    Not documented. The docs describe a block duration being returned on 418 but do not name
    Retry-After. Recorded as unverified rather than asserted.
exhaustion:
  status: 429
  meaning: Too Many Requests — call quota exceeded.
  escalation:
    status: 418
    meaning: >-
      "I'm a teapot" — returned on continued violation. The IP or account is temporarily blocked
      and a block duration is returned. An agent that keeps retrying past 429 is escalated to 418,
      so 429 must be treated as a hard backoff signal, not a soft one.
