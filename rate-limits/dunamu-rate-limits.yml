special_policies:
- name: Origin-header requests
  limit: 1
  window: 10 seconds
  applies_to: [Quotation REST API, WebSocket]
  note: >-
    A separate, far tighter policy applied to requests that carry an Origin header — i.e. calls
    made from a browser. Browser-originated agents are effectively rate-limited 100x harder than
    server-side ones.
