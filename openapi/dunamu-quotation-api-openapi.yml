openapi: 3.2.0
info:
  title: Quotation API
  version: 1.0.0
servers:
- url: https://{region}-api.upbit.com
tags:
- name: Quotation
paths:
  /v1/candles/days:
    get:
      operationId: list-candles-days
      summary: List Day Candles
      description: Retrieves the list of candles per day.
      tags:
      - Quotation
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
          description: Trading pair code to query.
          example: SGD-BTC
        allowReserved: true
        examples:
          default:
            value: SGD-BTC
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: 'End time of the query range.

            Retrieves candles before the specified time. If not specified, the most recent candles are returned.


            Accepts ISO 8601 datetime format.

            '
          example: '2024-01-01T00:00:00'
        allowReserved: true
      - name: count
        in: query
        required: false
        schema:
          type: integer
          description: 'Number of candles to retrieve.


            Up to 200 candles are supported. Default: 1.

            '
          example: 200
          default: 1
        allowReserved: true
      responses:
        '200':
          description: List of candles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandleDay'
              examples:
                Successful Example:
                  value:
                  - market: SGD-BTC
                    candle_date_time_utc: '2025-07-30T00:00:00'
                    opening_price: 153473
                    high_price: 153504
                    low_price: 151937
                    trade_price: 152114
                    timestamp: 1753909903998
                    candle_acc_trade_price: 4564.10881053
                    candle_acc_trade_volume: 0.0299313
                    prev_closing_price: 151721
                    change_price: 393
                    change_rate: 0.0025902808
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parameter range error:
                  value:
                    error:
                      name: 400
                      message: Invalid parameter. Check the given value!
                parameter type error:
                  value:
                    error:
                      name: 400
                      message: Type mismatch error. Check the parameters type!
                missing required parameter error:
                  value:
                    error:
                      name: 400
                      message: Missing request parameter error. Check the required parameters!
        '404':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not found error:
                  value:
                    error:
                      name: 404
                      message: Code not found
  /v1/candles/minutes/{unit}:
    get:
      operationId: list-candles-minutes
      summary: List Minute Candles
      description: Retrieves the list of candles per minute.
      tags:
      - Quotation
      x-readme:
        parameter-ordering:
        - header
        - path
        - query
        - body
        - form
        - cookie
      parameters:
      - name: unit
        in: path
        required: true
        schema:
          type: integer
          format: int32
          description: 'Candle unit in minutes.


            Specify the candle unit to retrieve. Up to 240 minutes (4 hours) is supported.

            '
          example: 15
          enum:
          - 1
          - 3
          - 5
          - 10
          - 15
          - 30
          - 60
          - 240
        allowReserved: true
        examples:
          default:
            value: 15
      - name: market
        in: query
        required: true
        schema:
          type: string
          description: Trading pair code to query.
          example: SGD-BTC
        allowReserved: true
        examples:
          default:
            value: SGD-BTC
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: 'End time of the query range.

            Retrieves candles before the specified time. If not specified, the most recent candles are returned.


            Accepts ISO 8601 datetime format.


            [Example]

            2025-06-24T04:56:53Z

            2025-06-24 04:56:53

            2025-06-24T13:56:53+08:00

            '
          example: '2024-01-01T00:00:00'
        allowReserved: true
      - name: count
        in: query
        required: false
        schema:
          type: integer
          description: 'Number of candles to retrieve.


            Up to 200 candles are supported. Default: 1.

            '
          example: 200
          default: 1
        allowReserved: true
      responses:
        '200':
          description: List of candles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandleMinute'
              examples:
                Successful Example:
                  value:
                  - market: SGD-BTC
                    candle_date_time_utc: '2025-07-30T21:00:00'
                    opening_price: 153099
                    high_price: 153099
                    low_price: 153099
                    trade_price: 153099
                    timestamp: 1753975737223
                    candle_acc_trade_price: 26.72649243
                    candle_acc_trade_volume: 0.00017457
                    unit: 1
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parameter range error:
                  value:
                    error:
                      name: 400
                      message: Invalid parameter. Check the given value!
                parameter type error:
                  value:
                    error:
                      name: 400
                      message: Type mismatch error. Check the parameters type!
                missing required parameter error:
                  value:
                    error:
                      name: 400
                      message: Missing request parameter error. Check the required parameters!
        '404':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not found error:
                  value:
                    error:
                      name: 404
                      message: Code not found
