  /v1/trades/ticks:
    get:
      operationId: list-pair-trades
      summary: List Pair Trades
      description: Retrieves recent trades for the specified pair.
      tags:
      - Quotation
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
          description: Trading pair code to query.
          example: SGD-BTC
        allowReserved: true
        examples:
          default:
            value: SGD-BTC
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: 'End time within the query date range (UTC).

            Optional parameter to retrieve trades within a specific time of the query date.


            Accepts HHmmss or HH:mm:ss format. Trade list is returned in reverse chronological order from the specified time.

            '
          example: '134501'
        allowReserved: true
      - name: count
        in: query
        required: false
        schema:
          type: integer
          description: 'Number of trade records to retrieve.


            Up to 500 supported. Default: 1.

            '
          example: 500
          default: 1
        allowReserved: true
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: 'Cursor for pagination.

            Enter the "sequential_id" from the response to retrieve the previous "count" trade records prior to that trade.

            '
          example: 17510687993360000
        allowReserved: true
      - name: days_ago
        in: query
        required: false
        schema:
          type: integer
          description: 'Day offset between the query date and the request date.

            Must specify the target date; up to 7 days of history is supported (UTC-based).


            Integer between 1 and 7. If omitted, returns trades for the current date. If 7, returns trades from 7 days ago in reverse chronological order.

            '
          example: 1
        allowReserved: true
      responses:
        '200':
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
              examples:
                Successful Example:
                  value:
                  - market: SGD-BTC
                    trade_date_utc: '2025-07-31'
                    trade_time_utc: '15:28:57'
                    timestamp: 1753975737159
                    trade_price: 153099
                    trade_volume: 8.736e-05
                    prev_closing_price: 152114
                    change_price: 985
                    ask_bid: ASK
                    sequential_id: 1753975737159000
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parameter range error:
                  value:
                    error:
                      name: 400
                      message: Invalid parameter. Check the given value!
                parameter type error:
                  value:
                    error:
                      name: 400
                      message: Type mismatch error. Check the parameters type!
                missing required parameter error:
                  value:
                    error:
                      name: 400
                      message: Missing request parameter error. Check the required parameters!
        '404':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not found error:
                  value:
                    error:
                      name: 404
                      message: Code not found
components:
  schemas:
    Ticker:
      type: object
      required:
      - market
      - trade_date
      - trade_time
      - trade_timestamp
      - opening_price
      - high_price
      - low_price
      - trade_price
      - prev_closing_price
      - change
      - change_price
      - change_rate
      - signed_change_price
      - signed_change_rate
      - trade_volume
      - acc_trade_price
      - acc_trade_price_24h
      - acc_trade_volume
      - acc_trade_volume_24h
      - highest_52_week_price
      - highest_52_week_date
      - lowest_52_week_price
      - lowest_52_week_date
      - timestamp
      properties:
        market:
          type: string
          description: Trading pair code.
          example: SGD-BTC
        trade_date:
          type: string
          description: 'Most recent trade date (UTC-based).


            [Format] yyyyMMdd

            '
          example: 20250624
        trade_time:
          type: string
          description: 'Most recent trade time (UTC-based).


            [Format] HHmmss

            '
          example: 63514
        trade_timestamp:
          type: integer
          format: int64
          description: Milliseconds timestamp when the trade was executed.
          example: 1750179599265
        opening_price:
          type: number
          format: double
          description: Opening price of the trading pair.
          example: 142340000
        high_price:
          type: number
          format: double
          description: Highest trading price of the trading pair.
          example: 142340000
        low_price:
          type: number
          format: double
          description: Lowest trading price of the trading pair.
          example: 142340000
        trade_price:
          type: number
          format: double
          description: Current (closing) price of the trading pair.
          example: 142340000
        prev_closing_price:
          type: number
          format: double
          description: Previous day's closing price (UTC-based).
          example: 140908000
        change:
          type: string
          enum:
          - EVEN
          - RISE
          - FALL
          description: "Price change status.\n  - `EVEN`: No change\n  - `RISE`: Price rose\n  - `FALL`: Price fell\n"
          example: FALL
        change_price:
          type: number
          format: double
          description: 'Absolute price change from previous day''s closing price.


            Calculated as "trade_price" - "prev_closing_price".

            '
          example: 100000000
        change_rate:
          type: number
          format: double
          description: 'Absolute price change rate from previous day''s closing price.


            Calculated as ("trade_price" - "prev_closing_price") / "prev_closing_price".

            '
          example: 0.0031057175
        signed_change_price:
          type: number
          format: double
          description: "Signed price change from previous day's closing price.\nCalculated as \"trade_price\" - \"prev_closing_price\".\n  - Positive(+): price rose\n  - Negative(-): price fell\n"
          example: -454000
        signed_change_rate:
          type: number
          format: double
          description: "Signed price change rate from previous day's closing price.\nCalculated as (\"trade_price\" - \"prev_closing_price\") / \"prev_closing_price\".\n  - Positive(+): price rose\n  - Negative(-): price fell\n\n  [Example] 0.015 = 1.5% increase\n"
          example: -0.0031057175
        trade_volume:
          type: number
          format: double
          description: Most recent trade volume.
          example: 0.0068
        acc_trade_price:
          type: number
          format: double
          description: Accumulated trade amount since UTC midnight.
          example: 72976655137.21983
        acc_trade_price_24h:
          type: number
          format: double
          description: Accumulated trade amount over the past 24 hours.
          example: 344100708901.19037
        acc_trade_volume:
          type: number
          format: double
          description: Accumulated trade volume since UTC midnight.
          example: 501.38991748
        acc_trade_volume_24h:
          type: number
          format: double
          description: Accumulated trade volume over the past 24 hours.
          example: 2389.39562434
        highest_52_week_price:
          type: number
          format: double
          description: 52-week highest price.
          example: 163325000
        highest_52_week_date:
          type: string
          description: 'Date of 52-week highest price.


            [Format] yyyy-MM-dd

            '
          example: '2025-01-20'
        lowest_52_week_price:
          type: number
          format: double
          description: 52-week lowest price.
          example: 72100000
        lowest_52_week_date:
          type: string
          description: 'Date of 52-week lowest price.


            [Format] yyyy-MM-dd

            '
          example: '2024-08-05'
        timestamp:
          type: integer
          format: int64
          description: Timestamp (ms) when the ticker information was recorded.
          example: 1750746915062
    Candle:
      type: object
      required:
      - market
      - candle_date_time_utc
      - opening_price
      - high_price
      - low_price
      - trade_price
      - timestamp
      - candle_acc_trade_price
      - candle_acc_trade_volume
      properties:
        market:
          type: string
          description: 'Trading pair code representing the market.


            [Example]: "SGD-BTC"

            '
          example: SGD-BTC
        candle_date_time_utc:
          type: string
          description: 'Start time of the candle period in UTC.


            [Format]: yyyy-MM-dd''T''HH:mm:ss

            '
          example: '2025-06-23T14:29:59'
        opening_price:
          type: number
          format: double
          description: 'The opening price of the candle,

            representing the first trading price during the candle period.

            '
          example: 142340000
        high_price:
          type: number
          format: double
          description: 'The highest trading price,

            recorded during the candle period.

            '
          example: 142340000
        low_price:
          type: number
          format: double
          description: 'The lowest trading price,

            recorded during the candle period.

            '
          example: 142340000
        trade_price:
          type: number
          format: double
          description: The closing price of the candle, representing the last trading price during the candle period.
          example: 142340000
        timestamp:
          type: integer
          format: int64
          description: The timestamp (in milliseconds) when the last tick of the candle was recorded.
          example: 1750688999123
        candle_acc_trade_price:
          type: number
          format: double
          description: The total trade amount (in the quoted currency) accumulated during the candle period.
          example: 185042
        candle_acc_trade_volume:
          type: number
          format: double
          description: The total traded volume (in the base asset) accumulated during the candle period.
          example: 0.0013
    CandleDay:
      allOf:
      - $ref: '#/components/schemas/Candle'
      - type: object
        required:
        - prev_closing_price
        - change_price
        - change_rate
        properties:
          prev_closing_price:
            type: number
            format: double
            description: Previous day's closing price (UTC-based).
            example: 147996000
          change_price:
            type: number
            format: double
            description: Price change = trade_price - prev_closing_price.
            example: -2237000
          change_rate:
            type: number
            format: double
            description: Change rate = (trade_price - prev_closing_price) / prev_closing_price.
            example: -0.0151152734
          converted_trade_price:
            type: number
            format: double
            description: Closing price converted per converting_price_unit. Null for non-digital asset markets.
            example: 148601000
    Trade:
      type: object
      required:
      - market
      - trade_date_utc
      - trade_time_utc
      - timestamp
      - trade_price
      - trade_volume
      - prev_closing_price
      - change_price
      - ask_bid
      - sequential_id
      properties:
        market:
          type: string
          description: Trading pair code.
          example: SGD-BTC
        trade_date_utc:
          type: string
          description: 'Trade date (UTC-based).


            [Format] yyyy-MM-dd

            '
          example: '2025-06-17'
        trade_time_utc:
          type: string
          description: 'Trade time (UTC-based).


            [Format] HH:mm:ss

            '
          example: '16:59:59'
        timestamp:
          type: integer
          format: int64
          description: Milliseconds timestamp when the trade was executed.
          example: 1750749886904
        trade_price:
          type: number
          format: double
          description: Most recent trade price.
          example: 142340000
        trade_volume:
          type: number
          format: double
          description: Most recent trade volume.
          example: 100000000
        prev_closing_price:
          type: number
          format: double
          description: Previous day's closing price (UTC-based).
          example: 140908000
        change_price:
          type: number
          format: double
          description: "Price change from previous day's closing price.\nCalculated as \"trade_price\" - \"prev_closing_price\".\n  - Positive(+): current price rose from previous closing\n  - Negative(-): current price fell from previous closing\n  - 0: no change from previous closing\n"
          example: 100000000
        ask_bid:
          type: string
          enum:
          - ASK
          - BID
          description: Trade direction — ASK (sell) or BID (buy).
          example: ASK
        sequential_id:
          type: integer
          description: 'Unique identifier for the trade.


            This field does not guarantee the sequence of trades.

            '
          example: 17501795992650000
    OrderbookInstrument:
      type: object
      required:
      - market
      - quote_currency
      - tick_size
      properties:
        market:
          type: string
          description: Trading pair code.
          example: SGD-BTC
        quote_currency:
          type: string
          description: Quote currency code for the trading pair (e.g., SGD, BTC, USDT).
          example: SGD
        tick_size:
          type: string
          description: Price unit applied to the orderbook level.
          example: '10000'
    Orderbook:
      type: object
      required:
      - market
      - timestamp
      - total_ask_size
      - total_bid_size
      - orderbook_units
      - level
      properties:
        market:
          type: string
          description: Trading pair code.
          example: SGD-BTC
        timestamp:
          type: integer
          format: int64
          description: Timestamp of the query request (ms).
          example: 1750749886904
        total_ask_size:
          type: number
          format: double
          description: Total ask volume in the current orderbook.
          example: 10.64580882
        total_bid_size:
          type: number
          format: double
          description: Total bid volume in the current orderbook.
          example: 8.26105616
        orderbook_units:
          description: List of orderbook entries ordered from level 1 to level 30.
          type: array
          items:
            type: object
            description: Individual orderbook entry.
            required:
            - ask_price
            - bid_price
            - ask_size
            - bid_size
            properties:
              ask_price:
                type: number
                format: double
                description: Lowest sell (ask) price.
                example: 146030000
              bid_price:
                type: number
                format: double
                description: Highest buy (bid) price.
                example: 146000000
              ask_size:
                type: number
                format: double
                description: Sell quantity at ask price.
                example: 0.74547181
              bid_size:
                type: number
                format: double
                description: Buy quantity at bid price.
                example: 0.20338834
        level:
          type: number
          format: double
          description: Price unit applied for this orderbook level.
          example: 10000
          default: 0
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - name
          - message
          properties:
            name:
              type: string
              description: Name identifying the error.
            message:
              type: string
              description: Message describing the cause of the error.
    Market:
      type: object
      required:
      - market
      - english_name
      properties:
        market:
          type: string
          description: 'Trading pair code representing the market.


            [Example]: "SGD-BTC"

            '
          example: SGD-BTC
        english_name:
          type: string
          description: English name of the digital asset.
          example: Bitcoin
        market_warning:
          type: string
          enum:
          - NONE
          - CAUTION
          description: Trading pair warning status.
          example: NONE
    CandleMinute:
      allOf:
      - $ref: '#/components/schemas/Candle'
      - type: object
        required:
        - unit
        properties:
          unit:
            type: integer
            format: int32
            enum:
            - 1
            - 3
            - 5
            - 10
            - 15
            - 30
            - 60
            - 240
            description: Candle unit in minutes.
            example: 1
    CandlePeriod:
      allOf:
      - $ref: '#/components/schemas/Candle'
      - type: object
        required:
