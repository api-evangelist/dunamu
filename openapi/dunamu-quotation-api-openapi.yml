      description: Retrieves the real-time orderbook data for the specified markets.
      tags:
      - Quotation
      parameters:
      - name: markets
        in: query
        required: true
        schema:
          type: string
          description: 'List of trading pairs to query.


            For multiple pairs, use comma-separated format.

            '
          example: SGD-BTC,SGD-ETH
        allowReserved: true
        examples:
          default:
            value: SGD-BTC,SGD-ETH
      - name: count
        in: query
        required: false
        schema:
          type: integer
          description: 'Number of orderbook entries to retrieve.


