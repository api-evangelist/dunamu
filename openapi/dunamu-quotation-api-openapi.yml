  /v1/candles/seconds:
    get:
      operationId: list-candles-seconds
      summary: List Second Candles
      description: Retrieves the list of candles per second.
      tags:
      - Quotation
      parameters:
      - name: market
        in: query
        required: true
        schema:
          type: string
          description: Trading pair code to query.
          example: SGD-BTC
        allowReserved: true
        examples:
          default:
            value: SGD-BTC
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: 'End time of the query range.

            Retrieves candles before the specified time. If not specified, the most recent candles are returned.


            Accepts ISO 8601 datetime format. URL encoding is required for spaces and special characters.


            [Example] 2025-06-24T04:56:53Z

            2025-06-24 04:56:53

            2025-06-24T13:56:53+08:00


            Second candles only support data up to 3 months prior. An empty array is returned for older times.

            '
          example: '2024-01-01T00:00:00'
        allowReserved: true
      - name: count
        in: query
        required: false
        schema:
          type: integer
          description: 'Number of candles to retrieve.


            Up to 200 candles are supported. Default: 1.

            '
          example: 200
          default: 1
        allowReserved: true
      responses:
        '200':
          description: List of candles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candle'
              examples:
                Successful Example:
                  value:
                  - market: SGD-BTC
                    candle_date_time_utc: '2025-07-30T21:11:43'
                    opening_price: 152114
                    high_price: 152114
                    low_price: 152114
                    trade_price: 152114
