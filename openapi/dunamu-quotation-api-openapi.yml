  /v1/market/all:
    get:
      operationId: list-trading-pairs
      summary: List Trading Pairs
      description: Retrieves the list of all trading pairs supported by Upbit.
      tags:
      - Quotation
      parameters:
      - name: is_details
        in: query
        required: false
        schema:
          type: boolean
          description: 'Whether to include detailed information in the query.

            If true, the response includes detail fields such as caution or warning designation.

            Default: false.

            '
          example: true
        examples:
          default:
            value: false
      responses:
        '200':
          description: List of trading pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'
              examples:
                Successful Example:
                  value:
                  - market: SGD-ETH
                    english_name: Ethereum
                    market_warning: NONE
                  - market: SGD-XRP
                    english_name: XRP
                    market_warning: NONE
                  - market: SGD-BTC
                    english_name: Bitcoin
                    market_warning: NONE
                  - market: SGD-USDT
                    english_name: Tether
                    market_warning: NONE
                  - market: SGD-SOL
                    english_name: Solana
                    market_warning: NONE
        '400':
          description: error object
          content:
            application/json:
              schema:
