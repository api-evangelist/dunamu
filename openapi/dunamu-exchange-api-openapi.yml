openapi: 3.2.0
info:
  title: Exchange API
  version: 1.0.0
servers:
- url: https://{region}-api.upbit.com
tags:
- name: Exchange
paths:
  /v1/accounts:
    get:
      operationId: get-balance
      summary: Get Account Balances
      description: Retrieves the list of assets and balances owned by the account.
      tags:
      - Exchange
      x-readme:
        code-samples:
        - language: curl
          code: 'curl --request GET \

            --url ''https://sg-api.upbit.com/v1/accounts'' \

            --header ''Authorization: Bearer {JWT_TOKEN}'' \

            --header ''accept: application/json''

            '
        - language: python
          install: pip install requests pyjwt python-dotenv
          code: "import os\nimport uuid\nimport jwt\nimport requests\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nBASE_URL = \"https://sg-api.upbit.com\"\nPATH = \"/v1/accounts\"\n\nACCESS_KEY = os.environ[\"UPBIT_OPEN_API_ACCESS_KEY\"]\nSECRET_KEY = os.environ[\"UPBIT_OPEN_API_SECRET_KEY\"]\n\npayload = {\n  \"access_key\": ACCESS_KEY,\n  \"nonce\": str(uuid.uuid4()),\n}\n\njwt_token = jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n\nheaders = {\n  \"Authorization\": f\"Bearer {jwt_token}\",\n  \"Accept\": \"application/json\",\n}\n\nres = requests.get(f\"{BASE_URL}{PATH}\", headers=headers)\nprint(res.json())\n"
        - language: node
          name: Axios
          install: 'npm install axios jsonwebtoken uuid

            '
          code: "const axios = require(\"axios\");\nconst { sign } = require(\"jsonwebtoken\");\nconst { v4: uuidv4 } = require(\"uuid\");\nrequire(\"dotenv\").config();\n\nconst baseURL = \"https://sg-api.upbit.com\";\nconst path = \"/v1/accounts\";\n\nconst ACCESS_KEY = process.env.UPBIT_OPEN_API_ACCESS_KEY;\nconst SECRET_KEY = process.env.UPBIT_OPEN_API_SECRET_KEY;\n\nconst payload = {\n  access_key: ACCESS_KEY,\n  nonce: uuidv4(),\n};\n\nconst jwtToken = sign(payload, SECRET_KEY);\n\nconst options = {\n  method: \"GET\",\n  url: `${baseURL}${path}`,\n  headers: {\n    Authorization: `Bearer ${jwtToken}`,\n    Accept: \"application/json\",\n  },\n};\n\naxios\n  .request(options)\n  .then((response) => {\n    console.log(response.data);\n  })\n  .catch((error) => {\n    console.error(error.response ? error.response.data : error.message);\n  });\n"
        - language: java
          code: "package main;\n\nimport com.auth0.jwt.JWT;\nimport com.auth0.jwt.algorithms.Algorithm;\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\nimport java.security.NoSuchAlgorithmException;\nimport java.util.Objects;\nimport java.util.UUID;\nimport okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.Response;\n\npublic class GetBalance {\n    private static final String BASE_URL = \"https://sg-api.upbit.com\";\n    private static final String PATH = \"/v1/accounts\";\n\n    public static void main(String[] args) throws NoSuchAlgorithmException, IOException {\n        String accessKey = System.getenv(\"UPBIT_OPEN_API_ACCESS_KEY\");\n        String secretKey = System.getenv(\"UPBIT_OPEN_API_SECRET_KEY\");\n\n\n        Algorithm algorithm = Algorithm.HMAC512(secretKey.getBytes(StandardCharsets.UTF_8));\n        String jwtToken = JWT.create()\n            .withClaim(\"access_key\", accessKey)\n            .withClaim(\"nonce\", UUID.randomUUID().toString())\n            .sign(algorithm);\n\n        String authHeader = \"Bearer \" + jwtToken;\n\n        OkHttpClient client = new OkHttpClient();\n        Request request = new Request.Builder()\n            .url(BASE_URL + PATH)\n            .get()\n            .addHeader(\"Content-Type\", \"application/json\")\n            .addHeader(\"Authorization\", authHeader)\n            .build();\n\n        try (Response response = client.newCall(request).execute()) {\n            System.out.println(response.code());\n            System.out.println(Objects.requireNonNull(response.body()).string());\n        }\n    }\n}\n"
      responses:
        '200':
          description: List of account balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
              examples:
                Successful Example:
                  value:
                  - currency: SGD
                    balance: '1000000.0'
                    locked: '0.0'
                    avg_buy_price: '0'
                    avg_buy_price_modified: false
                    unit_currency: SGD
                  - currency: BTC
                    balance: '2.0'
                    locked: '0.0'
                    avg_buy_price: '101000'
                    avg_buy_price_modified: false
                    unit_currency: SGD
        '401':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no authorization ip error:
                  value:
                    error:
                      name: no_authorization_ip
                      message: This is not a verified IP.
  /v1/deposit:
    get:
      operationId: get-deposit
      summary: Get Deposit
      description: Retrieves the latest deposit history. To query specific deposit information, you can specify the deposit’s UUID, transaction ID (TXID), or currency code.
      tags:
      - Exchange
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n  --url 'https://sg-api.upbit.com/v1/deposit?uuid=94332e99-3a87-4a35-ad98-28b0c969f830' \\\n  --header 'Authorization: Bearer {JWT_TOKEN}' \\\n  --header 'Accept: application/json'\n"
        - language: python
          install: pip install requests pyjwt python-dotenv
          code: "import os\nimport uuid\nimport hashlib\nimport jwt\nimport requests\nfrom urllib.parse import unquote, urlencode\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nBASE_URL = \"https://sg-api.upbit.com\"\nPATH = \"/v1/deposit\"\n\nACCESS_KEY = os.environ[\"UPBIT_OPEN_API_ACCESS_KEY\"]\nSECRET_KEY = os.environ[\"UPBIT_OPEN_API_SECRET_KEY\"]\n\nparams = {\n  \"uuid\": \"94332e99-3a87-4a35-ad98-28b0c969f830\",\n}\n\nquery_string = unquote(urlencode(params, doseq=True)).encode(\"utf-8\")\n\nm = hashlib.sha512()\nm.update(query_string)\nquery_hash = m.hexdigest()\n\npayload = {\n  \"access_key\": ACCESS_KEY,\n  \"nonce\": str(uuid.uuid4()),\n  \"query_hash\": query_hash,\n  \"query_hash_alg\": \"SHA512\",\n}\n\njwt_token = jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n\nheaders = {\n  \"Authorization\": f\"Bearer {jwt_token}\",\n  \"Accept\": \"application/json\",\n}\n\nres = requests.get(f\"{BASE_URL}{PATH}\", headers=headers, params=params)\nprint(res.json())\n"
        - language: node
          name: Axios
          install: npm install axios jsonwebtoken uuid
          code: "const axios = require(\"axios\");\nconst crypto = require(\"crypto\");\nconst { sign } = require(\"jsonwebtoken\");\nconst { v4: uuidv4 } = require(\"uuid\");\nrequire(\"dotenv\").config();\n\nconst baseURL = \"https://sg-api.upbit.com\";\nconst path = \"/v1/deposit\";\n\nconst ACCESS_KEY = process.env.UPBIT_OPEN_API_ACCESS_KEY;\nconst SECRET_KEY = process.env.UPBIT_OPEN_API_SECRET_KEY;\n\nconst params = {\n  uuid: \"94332e99-3a87-4a35-ad98-28b0c969f830\",\n};\n\nconst queryString = new URLSearchParams(params).toString();\n\nconst queryHash = crypto\n  .createHash(\"sha512\")\n  .update(queryString, \"utf-8\")\n  .digest(\"hex\");\n\nconst payload = {\n  access_key: ACCESS_KEY,\n  nonce: uuidv4(),\n  query_hash: queryHash,\n  query_hash_alg: \"SHA512\",\n};\n\nconst jwtToken = sign(payload, SECRET_KEY);\n\nconst options = {\n  method: \"GET\",\n  url: `${baseURL}${path}?${queryString}`,\n  headers: {\n    Authorization: `Bearer ${jwtToken}`,\n    Accept: \"application/json\",\n  },\n};\n\naxios\n  .request(options)\n  .then((response) => {\n    console.log(response.data);\n  })\n  .catch((error) => {\n    console.error(error.response ? error.response.data : error.message);\n  });\n"
        - language: java
          code: "package main;\n\nimport com.auth0.jwt.JWT;\nimport com.auth0.jwt.algorithms.Algorithm;\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.security.NoSuchAlgorithmException;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.stream.Collectors;\nimport okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.Response;\n\npublic class GetDeposit {\n    private static final String BASE_URL = \"https://sg-api.upbit.com\";\n    private static final String PATH = \"/v1/deposit\";\n\n    public static void main(String[] args) throws NoSuchAlgorithmException, IOException {\n        String accessKey = System.getenv(\"UPBIT_OPEN_API_ACCESS_KEY\");\n        String secretKey = System.getenv(\"UPBIT_OPEN_API_SECRET_KEY\");\n\n        Map<String, String> params = new HashMap<>();\n        params.put(\"uuid\", \"94332e99-3a87-4a35-ad98-28b0c969f830\");\n        String queryString = params.entrySet().stream()\n            .map(e -> e.getKey() + \"=\" + String.valueOf(e.getValue()))\n            .collect(Collectors.joining(\"&\"));\n\n        MessageDigest md = MessageDigest.getInstance(\"SHA-512\");\n        md.update(queryString.getBytes(StandardCharsets.UTF_8));\n        StringBuilder sb = new StringBuilder();\n        for (byte b : md.digest()) {\n            sb.append(String.format(\"%02x\", b));\n        }\n        String queryHash = sb.toString();\n\n        Algorithm algorithm = Algorithm.HMAC512(secretKey.getBytes(StandardCharsets.UTF_8));\n        String jwtToken = JWT.create()\n            .withClaim(\"access_key\", accessKey)\n            .withClaim(\"nonce\", UUID.randomUUID().toString())\n            .withClaim(\"query_hash\", queryHash)\n            .withClaim(\"query_hash_alg\", \"SHA512\")\n            .sign(algorithm);\n\n        String authHeader = \"Bearer \" + jwtToken;\n\n        OkHttpClient client = new OkHttpClient();\n        Request request = new Request.Builder()\n            .url(BASE_URL + PATH + \"?\" + queryString)\n            .get()\n            .addHeader(\"Content-Type\", \"application/json\")\n            .addHeader(\"Authorization\", authHeader)\n            .build();\n\n        try (Response response = client.newCall(request).execute()) {\n            System.out.println(response.code());\n            System.out.println(Objects.requireNonNull(response.body()).string());\n        }\n    }\n}\n"
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          type: string
          description: Currency code filter.
          example: BTC
        allowReserved: true
      - name: uuid
        in: query
        required: false
        schema:
          type: string
          description: 'UUID of the deposit to query.


            If neither uuid nor txid is provided, the latest deposit is returned.

            '
          example: 9ca023a5-851b-4fec-9f0a-48cd83c2eaae
        allowReserved: true
        examples:
          default:
            value: 94332e99-3a87-4a35-ad98-28b0c969f830
      - name: txid
        in: query
        required: false
        schema:
          type: string
          description: 'Transaction ID of the deposit to query.


            If neither uuid nor txid is provided, the latest deposit is returned.

            '
          example: 98c15999f0bdc4ae0e8a-ed35868bb0c204fe6ec29e4058a3451e-88636d1040f4baddf943274ce37cf9cc
        allowReserved: true
      responses:
        '200':
          description: Object of deposit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
              examples:
                Successful Example:
                  value:
                    type: deposit
                    uuid: 94332e99-3a87-4a35-ad98-28b0c969f830
                    currency: SGD
                    txid: BKD-2000-12-29-aeked29c05eadac293b4214994
                    state: ACCEPTED
                    created_at: '2025-07-04T15:00:00'
                    done_at: '2025-07-04T15:00:10'
                    amount: '100000.0'
                    fee: '0.0'
                    transaction_type: default
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid enum error:
                  value:
                    error:
                      name: validation_error
                      message: '"field name" does not have a valid value'
        '401':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid query payload error:
                  value:
                    error:
                      name: invalid_query_payload
                      message: Failed to validate query in JWT.
        '404':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not found deposit error:
                  value:
                    error:
                      name: deposit_not_found
                      message: Deposit information not found.
  /v1/deposits:
    get:
      operationId: list-deposits
      summary: List Deposits
      description: Retrieves the latest deposit list.
      tags:
      - Exchange
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n --url 'https://sg-api.upbit.com/v1/deposits?currency=SGD' \\\n --header 'Authorization: Bearer {JWT_TOKEN}' \\\n --header 'accept: application/json'\n"
        - language: python
          install: pip install requests pyjwt python-dotenv
          code: "import os\nimport uuid\nimport hashlib\nimport jwt\nimport requests\nfrom urllib.parse import unquote, urlencode\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nBASE_URL = \"https://sg-api.upbit.com\"\nPATH = \"/v1/deposits\"\n\nACCESS_KEY = os.environ[\"UPBIT_OPEN_API_ACCESS_KEY\"]\nSECRET_KEY = os.environ[\"UPBIT_OPEN_API_SECRET_KEY\"]\n\nparams = {\n    \"currency\": \"SGD\",\n}\n\nquery_string = unquote(urlencode(params, doseq=True)).encode(\"utf-8\")\n\nm = hashlib.sha512()\nm.update(query_string)\nquery_hash = m.hexdigest()\n\npayload = {\n    \"access_key\": ACCESS_KEY,\n    \"nonce\": str(uuid.uuid4()),\n    \"query_hash\": query_hash,\n    \"query_hash_alg\": \"SHA512\",\n}\n\njwt_token = jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n\nheaders = {\n    \"Authorization\": f\"Bearer {jwt_token}\",\n    \"Accept\": \"application/json\",\n}\n\nres = requests.get(f\"{BASE_URL}{PATH}\", headers=headers, params=params)\nprint(res.json())\n"
        - language: node
          name: Axios
          install: npm install axios jsonwebtoken uuid
          code: "const axios = require(\"axios\");\nconst crypto = require(\"crypto\");\nconst { sign } = require(\"jsonwebtoken\");\nconst { v4: uuidv4 } = require(\"uuid\");\nrequire(\"dotenv\").config();\n\nconst baseURL = \"https://sg-api.upbit.com\";\nconst path = \"/v1/deposits\";\n\nconst ACCESS_KEY = process.env.UPBIT_OPEN_API_ACCESS_KEY;\nconst SECRET_KEY = process.env.UPBIT_OPEN_API_SECRET_KEY;\n\nconst params = {\n    currency: \"SGD\",\n};\n\nconst queryString = new URLSearchParams(params).toString();\n\nconst queryHash = crypto\n    .createHash(\"sha512\")\n    .update(queryString, \"utf-8\")\n    .digest(\"hex\");\n\nconst payload = {\n    access_key: ACCESS_KEY,\n    nonce: uuidv4(),\n    query_hash: queryHash,\n    query_hash_alg: \"SHA512\",\n};\n\nconst jwtToken = sign(payload, SECRET_KEY);\n\nconst options = {\n    method: \"GET\",\n    url: `${baseURL}${path}?${queryString}`,\n    headers: {\n    Authorization: `Bearer ${jwtToken}`,\n    Accept: \"application/json\",\n    },\n};\n\naxios\n    .request(options)\n    .then((response) => {\n    console.log(response.data);\n    })\n    .catch((error) => {\n    console.error(error.response ? error.response.data : error.message);\n    });\n"
        - language: java
          code: "package main;\n\nimport com.auth0.jwt.JWT;\nimport com.auth0.jwt.algorithms.Algorithm;\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.security.NoSuchAlgorithmException;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.stream.Collectors;\nimport okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.Response;\n\npublic class ListDeposits {\n    private static final String BASE_URL = \"https://sg-api.upbit.com\";\n    private static final String PATH = \"/v1/deposits\";\n\n    public static void main(String[] args) throws NoSuchAlgorithmException, IOException {\n        String accessKey = System.getenv(\"UPBIT_OPEN_API_ACCESS_KEY\");\n        String secretKey = System.getenv(\"UPBIT_OPEN_API_SECRET_KEY\");\n\n        Map<String, String> params = new HashMap<>();\n        params.put(\"currency\", \"SGD\");\n        String queryString = params.entrySet().stream()\n            .map(e -> e.getKey() + \"=\" + String.valueOf(e.getValue()))\n            .collect(Collectors.joining(\"&\"));\n\n        MessageDigest md = MessageDigest.getInstance(\"SHA-512\");\n        md.update(queryString.getBytes(StandardCharsets.UTF_8));\n        StringBuilder sb = new StringBuilder();\n        for (byte b : md.digest()) {\n            sb.append(String.format(\"%02x\", b));\n        }\n        String queryHash = sb.toString();\n\n        Algorithm algorithm = Algorithm.HMAC512(secretKey.getBytes(StandardCharsets.UTF_8));\n        String jwtToken = JWT.create()\n            .withClaim(\"access_key\", accessKey)\n            .withClaim(\"nonce\", UUID.randomUUID().toString())\n            .withClaim(\"query_hash\", queryHash)\n            .withClaim(\"query_hash_alg\", \"SHA512\")\n            .sign(algorithm);\n\n        String authHeader = \"Bearer \" + jwtToken;\n\n        OkHttpClient client = new OkHttpClient();\n        Request request = new Request.Builder()\n            .url(BASE_URL + PATH + \"?\" + queryString)\n            .get()\n            .addHeader(\"Content-Type\", \"application/json\")\n            .addHeader(\"Authorization\", authHeader)\n            .build();\n\n        try (Response response = client.newCall(request).execute()) {\n            System.out.println(response.code());\n            System.out.println(Objects.requireNonNull(response.body()).string());\n        }\n    }\n}\n"
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          type: string
          description: 'Currency code filter.

            If not specified, the latest deposits are returned.

            '
          example: SGD
        allowReserved: true
        examples:
          default:
            value: SGD
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - PROCESSING
          - ACCEPTED
          - CANCELLED
          - REJECTED
          - TRAVEL_RULE_SUSPECTED
          - REFUNDING
          - REFUNDED
          description: 'Deposit state filter.


            * `PROCESSING`: Processing

            * `ACCEPTED`: Completed

            * `CANCELLED`: Cancelled

            * `REJECTED`: Rejected

            * `TRAVEL_RULE_SUSPECTED`: Pending Travel Rule verification

            * `REFUNDING`: Refund in progress

            * `REFUNDED`: Refunded

            '
        allowReserved: true
      - name: uuids[]
        in: query
        required: false
        schema:
          type: array
          description: 'List of UUIDs to query.


            [Example] uuids[]=uuid1&uuids[]=uuid2

            '
          items:
            type: string
            example: 9ca023a5-851b-4fec-9f0a-48cd83c2eaae
        allowReserved: true
      - name: txids[]
        in: query
        required: false
        schema:
          type: array
          description: 'List of transaction IDs to query.


            [Example] txids[]=txid1&txids[]=txid2

            '
          items:
            type: string
            example: 98c15999f0bdc4ae0e8a-ed35868bb0c204fe6ec29e4058a3451e-88636d1040f4baddf943274ce37cf9cc
        allowReserved: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          description: 'Number of results per request (default: 100, max: 100).'
          example: 100
          default: 100
        allowReserved: true
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Page number for pagination. Default is 1.
          example: 1
          default: 1
        allowReserved: true
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          description: Sort order. "desc" (newest first) or "asc" (oldest first). Default is "desc".
          example: desc
          default: desc
        allowReserved: true
      - name: from
        in: query
        required: false
        schema:
          type: string
          description: 'Cursor for pagination.

            Enter a "uuid" from the response to retrieve "limit" deposits after that timestamp.

            '
      - name: to
        in: query
        required: false
        schema:
          type: string
          description: 'Cursor for pagination.

            Enter a "uuid" from the response to retrieve "limit" deposits before that timestamp.

            '
      responses:
        '200':
          description: List of deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deposit'
              examples:
                Successful Example:
                  value:
                  - type: deposit
                    uuid: 94332e99-3a87-4a35-ad98-28b0c969f830
                    currency: SGD
                    txid: BKD-2000-12-29-aeked29c05eadac293b4214994
                    state: ACCEPTED
                    created_at: '2025-07-04T15:00:00'
                    done_at: '2025-07-04T15:00:10'
                    amount: '100000.0'
                    fee: '0.0'
                    transaction_type: default
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid enum error:
                  value:
                    error:
                      name: validation_error
                      message: '"field name" does not have a valid value'
        '401':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid query payload error:
                  value:
                    error:
                      name: invalid_query_payload
                      message: Failed to validate query in JWT.
  /v1/deposits/chance/coin:
    get:
      operationId: available-deposit-information
      summary: Get Available Deposit Information
      description: Deposits availability information for the specified currency is retrieved.
      tags:
      - Exchange
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request GET \\\n  --url 'https://sg-api.upbit.com/v1/deposits/chance/coin?currency=BTC&net_type=BTC' \\\n  --header 'Authorization: Bearer {JWT_TOKEN}' \\\n  --header 'Accept: application/json'\n"
        - language: python
          install: pip install requests pyjwt python-dotenv
          code: "import os\nimport uuid\nimport hashlib\nimport jwt\nimport requests\nfrom urllib.parse import unquote, urlencode\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nBASE_URL = \"https://sg-api.upbit.com\"\nPATH = \"/v1/deposits/chance/coin\"\n\nACCESS_KEY = os.environ[\"UPBIT_OPEN_API_ACCESS_KEY\"]\nSECRET_KEY = os.environ[\"UPBIT_OPEN_API_SECRET_KEY\"]\n\nparams = {\n  \"currency\": \"BTC\",\n  \"net_type\": \"BTC\",\n}\n\nquery_string = unquote(urlencode(params, doseq=True)).encode(\"utf-8\")\n\nm = hashlib.sha512()\nm.update(query_string)\nquery_hash = m.hexdigest()\n\npayload = {\n  \"access_key\": ACCESS_KEY,\n  \"nonce\": str(uuid.uuid4()),\n  \"query_hash\": query_hash,\n  \"query_hash_alg\": \"SHA512\",\n}\n\njwt_token = jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n\nheaders = {\n  \"Authorization\": f\"Bearer {jwt_token}\",\n  \"Accept\": \"application/json\",\n}\n\nres = requests.get(f\"{BASE_URL}{PATH}\", headers=headers, params=params)\nprint(res.json())\n"
        - language: node
          name: Axios
          install: npm install axios jsonwebtoken uuid
