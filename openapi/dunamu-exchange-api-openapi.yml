  /v1/orders/cancel_and_new:
    post:
      operationId: cancel-and-new-order
      summary: Cancel and New Order
      description: Cancel existing order and create new order in a single request.
      tags:
      - Exchange
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n  --url 'https://sg-api.upbit.com/v1/orders/cancel_and_new' \\\n  --header 'Authorization: Bearer {JWT_TOKEN}' \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --data '\n{\n\"prev_order_uuid\": \"ad217e24-ed02-469c-9b30-c08dbbda6908\",\n\"new_ord_type\": \"limit\",\n\"new_price\": \"100000000\",\n\"new_volume\": \"1\"\n}\n'\n"
        - language: python
          install: pip install requests pyjwt python-dotenv
          code: "import os\nimport uuid\nimport hashlib\nimport jwt\nimport requests\nfrom urllib.parse import unquote, urlencode\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nBASE_URL = \"https://sg-api.upbit.com\"\nPATH = \"/v1/orders/cancel_and_new\"\n\nACCESS_KEY = os.environ[\"UPBIT_OPEN_API_ACCESS_KEY\"]\nSECRET_KEY = os.environ[\"UPBIT_OPEN_API_SECRET_KEY\"]\n\nparams = {\n  \"prev_order_uuid\": \"ad217e24-ed02-469c-9b30-c08dbbda6908\",\n  \"new_ord_type\": \"limit\",\n  \"new_price\": \"100000000\",\n  \"new_volume\": \"1\",\n}\nquery_string = unquote(urlencode(params, doseq=True)).encode(\"utf-8\")\n\nm = hashlib.sha512()\nm.update(query_string)\nquery_hash = m.hexdigest()\n\npayload = {\n  \"access_key\": ACCESS_KEY,\n  \"nonce\": str(uuid.uuid4()),\n  \"query_hash\": query_hash,\n  \"query_hash_alg\": \"SHA512\",\n}\n\njwt_token = jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n\nheaders = {\n  \"Authorization\": f\"Bearer {jwt_token}\",\n  \"Accept\": \"application/json\",\n}\n\nres = requests.post(f\"{BASE_URL}{PATH}\", headers=headers, json=params)\nprint(res.json())\n"
        - language: node
          name: Axios
          install: npm install axios jsonwebtoken uuid
          code: "const axios = require(\"axios\");\nconst crypto = require(\"crypto\");\nconst { sign } = require(\"jsonwebtoken\");\nconst { v4: uuidv4 } = require(\"uuid\");\nrequire(\"dotenv\").config();\n\nconst baseURL = \"https://sg-api.upbit.com\";\nconst path = \"/v1/orders/cancel_and_new\";\n\nconst ACCESS_KEY = process.env.UPBIT_OPEN_API_ACCESS_KEY;\nconst SECRET_KEY = process.env.UPBIT_OPEN_API_SECRET_KEY;\n\nconst params = {\n  prev_order_uuid: \"ad217e24-ed02-469c-9b30-c08dbbda6908\",\n  new_ord_type: \"limit\",\n  new_price: \"100000000\",\n  new_volume: \"1\",\n};\n\nconst queryString = new URLSearchParams(params).toString();\n\nconst queryHash = crypto\n  .createHash(\"sha512\")\n  .update(queryString, \"utf-8\")\n  .digest(\"hex\");\n\nconst payload = {\n  access_key: ACCESS_KEY,\n  nonce: uuidv4(),\n  query_hash: queryHash,\n  query_hash_alg: \"SHA512\",\n};\n\nconst jwtToken = sign(payload, SECRET_KEY);\n\nconst options = {\n  method: \"POST\",\n  url: `${baseURL}${path}`,\n  headers: {\n    Authorization: `Bearer ${jwtToken}`,\n    Accept: \"application/json\",\n  },\n  data: params,\n};\n\naxios\n  .request(options)\n  .then((response) => {\n    console.log(response.data);\n  })\n  .catch((error) => {\n    console.error(error.response ? error.response.data : error.message);\n  });\n"
        - language: java
          code: "package main;\n\nimport com.auth0.jwt.JWT;\nimport com.auth0.jwt.algorithms.Algorithm;\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.security.NoSuchAlgorithmException;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.stream.Collectors;\nimport okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.RequestBody;\nimport okhttp3.Response;\nimport com.google.gson.Gson;\n\npublic class CancelAndNew {\n    private static final String BASE_URL = \"https://sg-api.upbit.com\";\n    private static final String PATH = \"/v1/orders/cancel_and_new\";\n\n\n    public static void main(String[] args) throws NoSuchAlgorithmException, IOException {\n        String accessKey = System.getenv(\"UPBIT_OPEN_API_ACCESS_KEY\");\n        String secretKey = System.getenv(\"UPBIT_OPEN_API_SECRET_KEY\");\n\n        Map<String, String> params = new HashMap<>();\n        params.put(\"prev_order_uuid\", \"ad217e24-ed02-469c-9b30-c08dbbda6908\");\n        params.put(\"new_ord_type\", \"limit\");\n        params.put(\"new_price\", \"100000000\");\n        params.put(\"new_volume\", \"1\");\n        String queryString = params.entrySet().stream()\n            .map(e -> e.getKey() + \"=\" + String.valueOf(e.getValue()))\n            .collect(Collectors.joining(\"&\"));\n\n        MessageDigest md = MessageDigest.getInstance(\"SHA-512\");\n        md.update(queryString.getBytes(StandardCharsets.UTF_8));\n        StringBuilder sb = new StringBuilder();\n        for (byte b : md.digest()) {\n            sb.append(String.format(\"%02x\", b));\n        }\n        String queryHash = sb.toString();\n\n        Algorithm algorithm = Algorithm.HMAC512(secretKey.getBytes(StandardCharsets.UTF_8));\n        String jwtToken = JWT.create()\n            .withClaim(\"access_key\", accessKey)\n            .withClaim(\"nonce\", UUID.randomUUID().toString())\n            .withClaim(\"query_hash\", queryHash)\n            .withClaim(\"query_hash_alg\", \"SHA512\")\n            .sign(algorithm);\n\n        String authHeader = \"Bearer \" + jwtToken;\n\n        String jsonBody = new Gson().toJson(params);\n        OkHttpClient client = new OkHttpClient();\n        Request request = new Request.Builder()\n            .url(BASE_URL + PATH)\n            .post(RequestBody.create(jsonBody, okhttp3.MediaType.parse(\"application/json; charset=utf-8\")))\n            .addHeader(\"Content-Type\", \"application/json\")\n            .addHeader(\"Authorization\", authHeader)\n            .build();\n\n        try (Response response = client.newCall(request).execute()) {\n            System.out.println(response.code());\n            System.out.println(Objects.requireNonNull(response.body()).string());\n        }\n    }\n}\n"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              default:
                value:
                  prev_order_uuid: ad217e24-ed02-469c-9b30-c08dbbda6908
                  new_ord_type: limit
                  new_price: '100000000'
                  new_volume": '1'
            schema:
              type: object
              required:
              - new_ord_type
              properties:
                prev_order_uuid:
                  type: string
                  description: UUID of the order to cancel.
                  example: 9ca023a5-851b-4fec-9f0a-48cd83c2eaae
                prev_order_identifier:
                  type: string
                  description: Client-assigned identifier of the order to cancel.
                  example: 9ca023a5-851b-4fec-9f0a-48cd83c2eaae
                new_ord_type:
                  allOf:
                  - $ref: '#/components/schemas/OrdTypeEnum'
                  description: 'Order type for the new order.


                    * `limit`: Limit order

                    * `price`: Market buy order (by total price)

                    * `market`: Market sell order (by volume)

                    * `best`: Best available price order

                    '
                new_volume:
                  type: string
                  format: decimal
                  description: Volume for the new order.
                  example: remain_only
                new_price:
                  type: string
                  format: decimal
                  description: Price or total amount for the new order.
                  example: '1000'
                new_identifier:
                  type: string
                  description: Client-assigned identifier for the new order.
                  example: 9ca023a5-851b-4fec-9f0a-48cd83c2eaae
                new_time_in_force:
                  allOf:
                  - $ref: '#/components/schemas/TimeInForceEnum'
                  description: 'Time in force condition for the new order.


                    * `fok`: Fill or Kill

                    * `ioc`: Immediate or Cancel

                    * `post_only`: Post only (maker only)

                    '
                new_smp_type:
                  allOf:
                  - $ref: '#/components/schemas/SmpTypeEnum'
                  description: 'SMP mode for the new order.


                    * `cancel_maker`: Cancel maker order

                    * `cancel_taker`: Cancel taker order

                    * `reduce`: Reduce order quantity

                    '
      responses:
        '201':
          description: Object of cancel-and-new order result
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Order'
                - type: object
                  required:
                  - new_order_uuid
                  properties:
                    new_order_uuid:
                      type: string
                      description: Unique identifier of the newly created order.
                      example: 4b07aa31-4747-485c-8bce-ac5495e4a639
                    new_order_identifier:
                      type: string
                      description: Client-assigned identifier of the newly created order.
                      example: 9ca023a5-851b-4fec-9f0a-48cd83c2eaae
              examples:
                Successful Example:
                  value:
                    uuid: d098ceaf-6811-4df8-97f2-b7e01aefc03f
                    side: bid
                    ord_type: limit
                    price: '153559.00'
                    state: wait
                    market: SGD-BTC
                    created_at: '2025-07-04T15:00:00'
                    volume: '1.0'
                    remaining_volume: '1.0'
                    executed_volume: '0'
                    reserved_fee: '383.8975'
                    remaining_fee: '383.8975'
                    paid_fee: '0'
                    locked: '153942.8975'
                    prevented_volume: '0'
                    prevented_locked: '0'
                    trades_count: 0
                    new_order_uuid: 4b07aa31-4747-485c-8bce-ac5495e4a639
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid parameter error:
                  value:
                    error:
                      name: invalid_parameter
                      message: Invalid parameter
        '401':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized jwt error:
                  value:
                    error:
                      name: invalid_query_payload
                      message: Failed to verify the query of Jwt.
        '500':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal server error:
                  value:
                    error:
                      name: internal_server_error
                      message: Internal Server Error
