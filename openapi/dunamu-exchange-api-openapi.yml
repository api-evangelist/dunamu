  /v1/travel_rule/deposit/txid:
    post:
      operationId: verify-travelrule-by-txid
      summary: Verify Travel Rule by Deposit TxID
      description: Retrieves travel rule verification using the deposit TxID.
      tags:
      - Exchange
      x-readme:
        code-samples:
        - language: curl
          code: "curl --request POST \\\n  --url 'https://sg-api.upbit.com/v1/travel_rule/deposit/txid' \\\n  --header 'Authorization: Bearer {JWT_TOKEN}' \\\n  --header 'Content-Type: application/json' \\\n  --data '\n{\n\"txid\": \"5b871d34-fe38-4025-8f5c-9b22028f85d3\",\n\"vasp_uuid\": \"8d4fe968-82b2-42e5-822f-3840a245f802\",\n\"currency\": \"ETH\",\n\"net_type\": \"ETH\"\n}\n'\n"
        - language: python
          install: pip install requests pyjwt python-dotenv
          code: "import os\nimport uuid\nimport hashlib\nimport jwt\nimport requests\nfrom urllib.parse import unquote, urlencode\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\nBASE_URL = \"https://sg-api.upbit.com\"\nPATH = \"/v1/travel_rule/deposit/txid\"\n\nACCESS_KEY = os.environ[\"UPBIT_OPEN_API_ACCESS_KEY\"]\nSECRET_KEY = os.environ[\"UPBIT_OPEN_API_SECRET_KEY\"]\n\nparams = {\n  \"txid\": \"5b871d34-fe38-4025-8f5c-9b22028f85d3\",\n  \"vasp_uuid\": \"8d4fe968-82b2-42e5-822f-3840a245f802\",\n  \"currency\": \"ETH\",\n  \"net_type\": \"ETH\"\n}\n\nquery_string = unquote(urlencode(params, doseq=True)).encode(\"utf-8\")\n\nm = hashlib.sha512()\nm.update(query_string)\nquery_hash = m.hexdigest()\n\npayload = {\n  \"access_key\": ACCESS_KEY,\n  \"nonce\": str(uuid.uuid4()),\n  \"query_hash\": query_hash,\n  \"query_hash_alg\": \"SHA512\",\n}\n\njwt_token = jwt.encode(payload, SECRET_KEY, algorithm=\"HS256\")\n\nheaders = {\n  \"Authorization\": f\"Bearer {jwt_token}\",\n  \"Accept\": \"application/json\",\n}\n\nres = requests.post(f\"{BASE_URL}{PATH}\", headers=headers, json=params)\nprint(res.json())\n"
        - language: node
          name: Axios
          install: npm install axios jsonwebtoken uuid
          code: "const axios = require(\"axios\");\nconst crypto = require(\"crypto\");\nconst { sign } = require(\"jsonwebtoken\");\nconst { v4: uuidv4 } = require(\"uuid\");\nrequire(\"dotenv\").config();\n\nconst baseURL = \"https://sg-api.upbit.com\";\nconst path = \"/v1/travel_rule/deposit/txid\";\n\nconst ACCESS_KEY = process.env.UPBIT_OPEN_API_ACCESS_KEY;\nconst SECRET_KEY = process.env.UPBIT_OPEN_API_SECRET_KEY;\n\nconst params = {\n  txid: \"5b871d34-fe38-4025-8f5c-9b22028f85d3\",\n  vasp_uuid: \"8d4fe968-82b2-42e5-822f-3840a245f802\",\n  currency: \"ETH\",\n  net_type: \"ETH\"\n};\n\nconst queryString = new URLSearchParams(params).toString();\n\nconst queryHash = crypto\n  .createHash(\"sha512\")\n  .update(queryString, \"utf-8\")\n  .digest(\"hex\");\n\nconst payload = {\n  access_key: ACCESS_KEY,\n  nonce: uuidv4(),\n  query_hash: queryHash,\n  query_hash_alg: \"SHA512\",\n};\n\nconst jwtToken = sign(payload, SECRET_KEY);\n\nconst options = {\n  method: \"POST\",\n  url: `${baseURL}${path}`,\n  headers: {\n    Authorization: `Bearer ${jwtToken}`,\n    Accept: \"application/json\",\n  },\n  data: params,\n};\n\naxios\n  .request(options)\n  .then((response) => {\n    console.log(response.data);\n  })\n  .catch((error) => {\n    console.error(error.response ? error.response.data : error.message);\n  });\n"
        - language: java
          code: "package main;\n\nimport com.auth0.jwt.JWT;\nimport com.auth0.jwt.algorithms.Algorithm;\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.security.NoSuchAlgorithmException;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.stream.Collectors;\nimport okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.RequestBody;\nimport okhttp3.Response;\nimport com.google.gson.Gson;\n\npublic class CreateDepositAddress {\n    private static final String BASE_URL = \"https://sg-api.upbit.com\";\n    private static final String PATH = \"/v1/travel_rule/deposit/txid\";\n\n    public static void main(String[] args) throws NoSuchAlgorithmException, IOException {\n        String accessKey = System.getenv(\"UPBIT_OPEN_API_ACCESS_KEY\");\n        String secretKey = System.getenv(\"UPBIT_OPEN_API_SECRET_KEY\");\n\n        Map<String, String> params = new HashMap<>();\n        params.put(\"txid\", \"5b871d34-fe38-4025-8f5c-9b22028f85d3\");\n        params.put(\"vasp_uuid\", \"8d4fe968-82b2-42e5-822f-3840a245f802\");\n        params.put(\"currency\", \"ETH\");\n        params.put(\"net_type\", \"ETH\");\n        String queryString = params.entrySet().stream()\n            .map(e -> e.getKey() + \"=\" + String.valueOf(e.getValue()))\n            .collect(Collectors.joining(\"&\"));\n\n        MessageDigest md = MessageDigest.getInstance(\"SHA-512\");\n        md.update(queryString.getBytes(StandardCharsets.UTF_8));\n        StringBuilder sb = new StringBuilder();\n        for (byte b : md.digest()) {\n            sb.append(String.format(\"%02x\", b));\n        }\n        String queryHash = sb.toString();\n\n        Algorithm algorithm = Algorithm.HMAC512(secretKey.getBytes(StandardCharsets.UTF_8));\n        String jwtToken = JWT.create()\n            .withClaim(\"access_key\", accessKey)\n            .withClaim(\"nonce\", UUID.randomUUID().toString())\n            .withClaim(\"query_hash\", queryHash)\n            .withClaim(\"query_hash_alg\", \"SHA512\")\n            .sign(algorithm);\n\n        String authHeader = \"Bearer \" + jwtToken;\n\n        String jsonBody = new Gson().toJson(params);\n        OkHttpClient client = new OkHttpClient();\n        Request request = new Request.Builder()\n            .url(BASE_URL + PATH)\n            .post(RequestBody.create(jsonBody, okhttp3.MediaType.parse(\"application/json; charset=utf-8\")))\n            .addHeader(\"Content-Type\", \"application/json\")\n            .addHeader(\"Authorization\", authHeader)\n            .build();\n\n        try (Response response = client.newCall(request).execute()) {\n            System.out.println(response.code());\n            System.out.println(Objects.requireNonNull(response.body()).string());\n        }\n    }\n}\n"
      requestBody:
        description: Travel Rule verification for deposit transaction by TxID
        content:
          application/json:
            examples:
              default:
                value:
                  txid: 5b871d34-fe38-4025-8f5c-9b22028f85d3
                  vasp_uuid: 8d4fe968-82b2-42e5-822f-3840a245f802
                  currency: ETH
                  net_type: ETH
            schema:
              type: object
              required:
              - vasp_uuid
              - txid
              - currency
              - net_type
              properties:
                vasp_uuid:
                  type: string
                  description: Unique identifier (UUID) of the counterparty exchange from which the asset was withdrawn.
                  example: 8d4fe968-82b2-42e5-822f-3840a245f802
                txid:
                  type: string
                  description: Transaction ID of the deposit to be verified.
                  example: 1234567890
                currency:
                  type: string
                  description: Currency code to be queried.
                  example: BTC
                net_type:
                  type: string
                  description: 'Blockchain network identifier for deposit/withdrawal of digital assets.

                    Used as a filter parameter to specify the network.

                    '
                  example: BTC
      responses:
        '201':
          description: Object of verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleVerificationResult'
              examples:
                Successful Example:
                  value:
                    deposit_uuid: 9f432943-54e0-40b7-825f-b6fec8b42b79
                    verification_result: verified
                    deposit_state: PROCESSING
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty parameter error:
                  value:
                    error:
                      name: validation_error
                      message: deposit_uuid is empty
                invalid value error:
                  value:
                    error:
                      name: validation_error
                      message: '"field name" does not have a valid value'
                missing required parameter error:
                  value:
                    error:
                      name: validation_error
                      message: currency is missing, currency does not have a valid value, currency is empty, net_type is missing, net_type does not have a valid value, net_type is empty
                already have deposit transaction error:
                  value:
                    error:
                      name: already_have_deposit_transaction
                      message: Already have deposit transaction
        '404':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not found deposit error:
                  value:
                    error:
                      name: deposit_not_found
                      message: Deposit information not found.
