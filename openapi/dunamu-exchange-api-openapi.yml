                      withdraw_delayed_fiat: '227.0'
                      can_withdraw: true
                      remaining_daily_sgd: '1000000.0'
        '400':
          description: error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid enum error:
                  value:
                    error:
                      name: validation_error
                      message: '"field name" does not have a valid value'
                invalid parameter error:
