description: >-
  Dunamu Inc. (두나무 주식회사) is a South Korean fintech and blockchain company founded in April 2012 and
  headquartered at 369 Gangnam-daero, Seocho-gu, Seoul. Dunamu operates Upbit, Korea's largest digital
  asset exchange (launched 2017, the country's first registered VASP), and Stockplus, a securities
  trading application launched in 2014, alongside Stockplus Unlisted for pre-IPO share trading. The
  group also spun out Lambda256 (blockchain infrastructure, now trading as Nodit) in 2019 and runs the
  Dunamu & Partners venture arm. Dunamu itself publishes no developer program at dunamu.com — its
  entire public API surface is served under the Upbit brand through the Upbit Developer Center, which
  offers REST and WebSocket APIs for market data, orders, accounts, deposits, withdrawals and Travel
  Rule compliance, plus first-party Python, TypeScript and Go SDKs, a CLI and packaged agent skills
  published from the upbit-official GitHub organization. That API surface is catalogued separately at
  the Upbit provider profile; this record profiles the corporate parent.
